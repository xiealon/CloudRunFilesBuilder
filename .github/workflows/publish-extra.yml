name: Publish Extra Fixed-Name Assets
# 把已有 release 里的 .run 复制成固定文件名，发布到 tag=extra
# 供 ImmortalWrt-ImageBuilder 的 shell/prepare-packages.sh 直链下载
on:
  workflow_dispatch:
    inputs:
      src_tag:
        description: 源 release tag
        default: mirror-2026-10-23
        required: true
      mapping:
        description: "源文件名:目标文件名，逗号分隔"
        default: "clashoo_2026.10.24_x86_64.run:clashoo_x86_64.run,mosdns_v5.3.4-r14_x86_64.run:mosdns_x86_64.run"
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SRC_TAG: ${{ inputs.src_tag }}
          MAP: ${{ inputs.mapping }}
        run: |
          set -euo pipefail
          R="$GITHUB_REPOSITORY"

          if ! gh release view extra -R "$R" >/dev/null 2>&1; then
            gh release create extra -R "$R" \
              --title "Extra Packages (fixed filenames)" \
              --notes "Fixed-name .run assets consumed directly by ImmortalWrt-ImageBuilder shell/prepare-packages.sh. Overwritten on every build." \
              --latest=false
          fi
          gh api -X PATCH "repos/$R/releases/tags/extra" -f make_latest=false >/dev/null || true

          mkdir -p dl
          IFS=',' read -ra ITEMS <<< "$MAP"
          for it in "${ITEMS[@]}"; do
            src="${it%%:*}"
            dst="${it##*:}"
            [ -z "$src" ] && continue
            echo "::group::$src -> $dst"
            gh release download "$SRC_TAG" -R "$R" -p "$src" -D dl --clobber
            mv -f "dl/$src" "dl/$dst"
            gh release upload extra "dl/$dst" -R "$R" --clobber
            echo "published $dst = $(stat -c%s "dl/$dst") bytes"
            rm -f "dl/$dst"
            echo "::endgroup::"
          done

          echo "### extra assets" >> "$GITHUB_STEP_SUMMARY"
          gh api "repos/$R/releases/tags/extra" --jq '.assets[] | "| \(.name) | \(.size) |"' >> "$GITHUB_STEP_SUMMARY"
