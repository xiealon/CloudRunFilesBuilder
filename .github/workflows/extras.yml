name: Build extras (24.10 ipk)

# 一个应用一个 .run，不再打成一个整体包（v.186）。
#   整体包的问题：一个 i18n 文件名错，整条构建线一起挂，且没法单独取某个包。
#
# 24.10（ipk）的产物发到 extra-ipk 标签，
# 25.12（apk）的产物发到 extra-apk 标签。
# 两个标签内部文件名完全一致，ImageBuilder 只需换 RUN_BASE。
#
# 源仍然是 xiealon/store、xiealon/apk 的 run/x86 子目录，不 clone 整仓（456 MB）。

on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * *'

# 上传 release 资产需要写权限；默认 GITHUB_TOKEN 只有 read
permissions:
  contents: write

jobs:
  extras:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - line: "24"
            repo: "store"
            ext: "ipk"
            tag: "extra-ipk"
            dirs: "luci-app-lucky:lucky luci-app-partexp:partexp luci-app-taskplan:taskplan rtp2httpd:rtp2httpd tailscale-community:tailscale-community luci-app-easytier:easytier"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Clone makeself
        run: git clone --depth=1 https://github.com/megastep/makeself.git

      - name: Fetch packages, one dir per app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ matrix.repo }}
          DIRS: ${{ matrix.dirs }}
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          for pair in $DIRS; do
            d="${pair%%:*}"
            out="${pair##*:}"
            mkdir -p "pkg-$out/install"
            # 必须用 API 返回的 .name（原名），不能用 basename(.download_url)：
            # download_url 把 ~ 编码成 %7E，落盘就成了 ...55893%7E28c17bc.apk，
            # 而 apk 索引里是 ~，25.12 构建直接报 package mentioned in index not found
            items=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                      "https://api.github.com/repos/xiealon/$REPO/contents/run/x86/$d?ref=master" \
                    | jq -r --arg ext ".$EXT" '.[] | select(.name|endswith($ext)) | [.name, .download_url] | @tsv')
            if [ -z "$items" ]; then
              echo "::error::xiealon/$REPO/run/x86/$d 没取到 .$EXT"; exit 1
            fi
            while IFS="$(printf '\t')" read -r f u; do
              [ -n "$f" ] || continue
              curl -fsSL "$u" -o "pkg-$out/install/$f"
              echo "  + $d/$f $(stat -c%s "pkg-$out/install/$f") B"
            done <<< "$items"
            printf '#!/bin/sh\nexit 0\n' > "pkg-$out/install.sh"
            chmod +x "pkg-$out/install.sh"
          done

          # luci-app-store 在 run/x86 根目录，本身是 makeself 的 .run，
          # 必须解开取里面的 ipk/apk。漏了它 25.12 直接死在
          #   ERROR: unable to select packages: luci-app-store (no such package)
          store_json=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                         "https://api.github.com/repos/xiealon/$REPO/contents/run/x86?ref=master")
          STORE_NAME=$(printf '%s' "$store_json" \
                         | jq -r '.[] | select(.type=="file") | select(.name|startswith("luci-app-store-")) | .name' \
                         | head -n1)
          STORE_URL=$(printf '%s' "$store_json" \
                        | jq -r '.[] | select(.type=="file") | select(.name|startswith("luci-app-store-")) | .download_url' \
                        | head -n1)
          if [ -z "$STORE_URL" ]; then
            echo "::error::xiealon/$REPO/run/x86 下没有 luci-app-store-*.run"; exit 1
          fi
          echo "  * luci-app-store <- $STORE_NAME"
          mkdir -p pkg-luci-app-store/install /tmp/storex
          curl -fsSL "$STORE_URL" -o /tmp/luci-app-store.run
          sh /tmp/luci-app-store.run --target /tmp/storex --noexec >/dev/null
          find /tmp/storex -type f \( -name '*.ipk' -o -name '*.apk' \) \
            -exec cp -v {} pkg-luci-app-store/install/ \;
          printf '#!/bin/sh\nexit 0\n' > pkg-luci-app-store/install.sh
          chmod +x pkg-luci-app-store/install.sh

          echo "---- 待打包目录:"
          ls -1d pkg-*

      - name: makeself, one .run per app
        run: |
          set -euo pipefail
          cd makeself
          for p in ../pkg-*; do
            [ -d "$p" ] || continue
            out=$(basename "$p" | sed 's/^pkg-//')
            ./makeself.sh "$p" "../${out}_x86_64.run" "${out} ${{ matrix.line }} x86_64" ./install.sh
          done
          ls -lh ../*_x86_64.run

      - name: Publish to ${{ matrix.tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
              --title "Extra Packages $TAG (fixed filenames)" \
              --notes "固定文件名 .run，供 ImmortalWrt-ImageBuilder 直链下载。" \
              --latest=false
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" -f make_latest=false >/dev/null || true
          fi
          gh release upload "$TAG" ./*_x86_64.run -R "$GITHUB_REPOSITORY" --clobber
          echo "### $TAG" >> "$GITHUB_STEP_SUMMARY"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            --jq '.assets[] | "| \(.name) | \(.size) |"' >> "$GITHUB_STEP_SUMMARY"
