# 用 ImmortalWrt SDK 从源码编译，不从任何 release / fork 取现成包。
#
# 每个应用编完单独打一个 <app>_x86_64.run，发到对应标签：
#   24.10 -> extra-ipk（ipk）
#   25.12 -> extra-apk（apk）
#
# apps 支持：单个 clashoo / 多个 "clashoo mosdns" / 全部 all
#
# ── 2026-10-26 v4 变更 ────────────────────────────────────────────────
# 1) 收集阶段改成"依赖闭包"：旧规则只按包名前缀捡 ipk，导致 run 里缺
#    geo2txt / v2ray-geoip / v2ray-geosite，用户装 luci-app-mosdns 时报
#    cannot find dependency geo2txt。现在由 .github/scripts/depclose.py
#    读 SDK 的 Packages 索引递归展开 Depends，把运行时依赖一起收进来；
#    设备自带的基础包（libc / luci-base / kmod-* …）走白名单不进 run。
# 2) mosdns 的 DIRS 加 geo2txt，并从 feeds 编 v2ray-geodata
#    （产出 v2ray-geoip + v2ray-geosite 两个数据包）。
# 3) 每个应用、每个 make 目标单独写日志，失败时自动 tail 关键报错，
#    不用再事后去下 51MB 的 job 日志。
# 4) install.sh 加 4 次重试：本地 ipk 互相依赖时 opkg 偶尔会因为顺序失败。
name: sdk build

on:
  workflow_dispatch:
    inputs:
      distro:
        description: 'SDK 版本'
        required: true
        default: '24.10'
        type: choice
        options: ['24.10', '25.12']
      apps:
        description: '要编译的应用（空格分隔，或填 all 全量）'
        required: true
        default: 'clashoo'
      upload:
        description: '是否上传到 release'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: sdk-build-${{ inputs.distro }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v6

      - name: 环境准备
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd build-essential libncurses-dev rsync
          python3 --version

      - name: 下载并解压 SDK
        run: |
          set -eu
          case "${{ inputs.distro }}" in
            24.10) SDK_VER=24.10.4; GCC=13.3.0 ;;
            25.12) SDK_VER=25.12.2; GCC=14.3.0 ;;
          esac
          F="immortalwrt-sdk-${SDK_VER}-x86-64_gcc-${GCC}_musl.Linux-x86_64.tar.zst"
          URL="https://downloads.immortalwrt.org/releases/${SDK_VER}/targets/x86/64/${F}"
          echo "SDK: $URL"
          wget -q "$URL" -O /tmp/sdk.tar.zst
          ls -l /tmp/sdk.tar.zst
          mkdir -p /opt/sdk
          tar --zstd -xf /tmp/sdk.tar.zst -C /opt/sdk
          SDK_DIR=$(ls -d /opt/sdk/*/ | head -n1)
          echo "SDK_DIR=$SDK_DIR" >> "$GITHUB_ENV"
          echo "解压到 $SDK_DIR"
          ls "$SDK_DIR"

      - name: 更新 feeds
        run: |
          set -eu
          cd "$SDK_DIR"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "--- golang feed ---"
          ls feeds/packages/lang/golang/ 2>/dev/null | head -5 || echo "缺少 golang feed"
          echo "--- geo 相关包 ---"
          ls feeds/packages/net/ | grep -i v2ray || true

      - name: 逐个应用源码编译
        run: |
          # 必须关 -e：否则子 shell 编挂会终止整个 step，rc=$? 执行不到，
          # "失败继续下一个"形同虚设
          set +e
          set -u
          cd "$SDK_DIR"
          mkdir -p /opt/sdkout /tmp/blogs
          DEPCLOSE="$GITHUB_WORKSPACE/.github/scripts/depclose.py"
          ls -l "$DEPCLOSE"

          APPS="${{ inputs.apps }}"
          if [ "$APPS" = "all" ]; then
            # openclash / openlist2 依赖最脏，排最后
            APPS="clashoo mosdns nikki momo passwall passwall2 ssrp homeproxy argon quickfile dufs daede openclash openlist2"
          fi
          echo "本轮编译: $APPS"

          # mk <目标> <标签>：单独日志，失败自动提取关键行
          mk() {
            _t="$1"; _tag="$2"; _log="/tmp/blogs/$APP.$_tag.log"
            if timeout 2700 make "$_t" V=s -j"$(nproc)" > "$_log" 2>&1; then
              echo "   ok  make $_t"
              return 0
            fi
            _rc=$?
            echo "   !!  make $_t 失败 rc=$_rc"
            echo "   ---- 末尾 30 行 ----"
            tail -n 30 "$_log" 2>/dev/null
            echo "   ---- 关键报错 ----"
            grep -inE 'error:|Error [0-9]|No rule to make|fatal|Killed|not found|undefined reference|cannot find' "$_log" 2>/dev/null | tail -n 20
            return $_rc
          }

          FAILED=""
          OKAPPS=""
          for APP in $APPS; do
            echo ""
            echo "################################ $APP ################################"
            (
              set -e
              rm -rf /tmp/src
              rm -rf "package/$APP" "package/luci-app-$APP"
              EXTRA=""
              case "$APP" in
                clashoo)   REPO=kenzok8/openwrt-clashoo;            BR=main;   DIRS="clashoo luci-app-clashoo" ;;
                # geo2txt 是 luci-app-mosdns 的硬依赖（geosite.dat 转纯文本给 mosdns 用），
                # 必须同仓一起编，否则用户装 luci 界面时 opkg 直接拒绝
                mosdns)    REPO=sbwml/luci-app-mosdns;              BR=v5;     DIRS="mosdns luci-app-mosdns geo2txt"; EXTRA="feeds/packages/net/v2ray-geodata" ;;
                openclash) REPO=vernesong/OpenClash;                BR=master; DIRS="luci-app-openclash" ;;
                nikki)     REPO=nikkinikki-org/OpenWrt-nikki;       BR=main;   DIRS="nikki luci-app-nikki mihomo-meta" ;;
                momo)      REPO=nikkinikki-org/OpenWrt-momo;        BR=main;   DIRS="momo luci-app-momo" ;;
                passwall)  REPO=Openwrt-Passwall/openwrt-passwall;  BR=main;   DIRS="luci-app-passwall" ;;
                passwall2) REPO=Openwrt-Passwall/openwrt-passwall2; BR=main;   DIRS="luci-app-passwall2" ;;
                homeproxy) REPO=immortalwrt/homeproxy;              BR=master; DIRS="" ;;
                argon)     REPO=jerrykuku/luci-theme-argon;         BR=master; DIRS="" ;;
                openlist2) REPO=sbwml/luci-app-openlist2;           BR=main;   DIRS="openlist2 luci-app-openlist2" ;;
                quickfile) REPO=sbwml/luci-app-quickfile;           BR=main;   DIRS="quickfile luci-app-quickfile" ;;
                dufs)      REPO=zouzonghao/luci-app-dufs;           BR=main;   DIRS="" ;;
                daede)     REPO=kenzok8/openwrt-daede;              BR=main;   DIRS="dae daed luci-app-daede" ;;
                # ssrp：跳过 v2raya / naiveproxy / shadowsocksr-libev（体积大、Rust 易炸、协议淘汰）
                ssrp)      REPO=fw876/helloworld;                   BR=dev;    DIRS="luci-app-ssr-plus xray-core mihomo hysteria chinadns-ng dns2socks microsocks ipt2socks" ;;
                *) echo "::warning::未配置源码: $APP"; exit 2 ;;
              esac

              echo "源码: $REPO @$BR"
              git clone --depth=1 -b "$BR" "https://github.com/$REPO" /tmp/src
              if [ -z "$DIRS" ]; then
                cp -r /tmp/src "package/$APP"
              else
                for d in $DIRS; do
                  if [ -d "/tmp/src/$d" ]; then
                    cp -r "/tmp/src/$d" "package/$d"
                  else
                    echo "::warning::$d 在 $REPO 里不存在"
                  fi
                done
              fi

              # feeds 里的额外包：先确保 feeds install 到位
              for t in $EXTRA; do
                case "$t" in
                  feeds/*)
                    FEED=$(echo "$t" | cut -d/ -f2)
                    PN=$(echo "$t" | cut -d/ -f4)
                    if [ ! -d "package/feeds/$FEED/$PN" ]; then
                      echo ">> feeds install -p $FEED $PN"
                      ./scripts/feeds install -p "$FEED" "$PN" || echo "::warning::feeds install $PN 失败"
                    fi
                    ;;
                esac
              done

              make defconfig

              # 先编 feeds 额外包（数据包，便宜）
              for t in $EXTRA; do
                case "$t" in
                  feeds/*)
                    FEED=$(echo "$t" | cut -d/ -f2); PN=$(echo "$t" | cut -d/ -f4)
                    TGT="package/feeds/$FEED/$PN"
                    ;;
                  *) TGT="$t" ;;
                esac
                [ -d "$TGT" ] || { echo "::warning::额外包目录不存在: $TGT"; continue; }
                echo ">> 额外编译 $TGT"
                mk "$TGT/compile" "extra_$(basename "$TGT")" || echo "::warning::$t 编译失败"
              done

              if [ -d "package/$APP" ]; then
                mk "package/$APP/compile" main || echo "::warning::$APP 主包编译失败"
              elif [ -d "package/luci-app-$APP" ]; then
                mk "package/luci-app-$APP/compile" main || echo "::warning::$APP 主包编译失败"
              else
                echo "::warning::package/$APP 与 package/luci-app-$APP 都不存在"
              fi
              for d in $DIRS; do
                [ "$d" = "$APP" ] && continue
                [ -d "package/$d" ] || continue
                mk "package/$d/compile" "dep_$d" || echo "::warning::$d 编译失败"
              done

              rm -rf "/opt/sdkout/$APP"
              mkdir -p "/opt/sdkout/$APP"
              PAT="^${APP}[_-]|^luci-app-${APP}[_-]|^luci-i18n-${APP}|^luci-theme-${APP}"
              for d in $DIRS; do PAT="$PAT|^${d}[_-]"; done
              echo "收集规则: $PAT"
              python3 "$DEPCLOSE" "$SDK_DIR" "$APP" "$PAT" "/opt/sdkout/$APP"
              rc=$?
              echo "--- $APP 收集结果 ---"
              ls -l "/opt/sdkout/$APP"
              du -sh "/opt/sdkout/$APP"
              if [ "$rc" -ne 0 ]; then
                echo "::warning::$APP 编译完成但一个包都没收到，检查收集规则"
                exit 3
              fi
            )
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::warning::$APP 编译失败 rc=$rc，继续下一个"
              FAILED="$FAILED $APP"
            else
              OKAPPS="$OKAPPS $APP"
            fi
          done
          echo ""
          echo "======== 成功:${OKAPPS:- 无} 失败:${FAILED:- 无} ========"

      - name: 打包成 run
        run: |
          set -u
          git clone --depth=1 https://github.com/megastep/makeself.git /tmp/makeself
          chmod +x /tmp/makeself/makeself.sh
          mkdir -p "$GITHUB_WORKSPACE/run"
          for D in /opt/sdkout/*/; do
            [ -d "$D" ] || continue
            APP=$(basename "$D")
            n=$(ls "$D" 2>/dev/null | wc -l)
            [ "$n" -gt 0 ] || { echo "::warning::$APP 无产物，跳过"; continue; }
            # apk 文件名必须严格等于 <pkgname>-<pkgver>.apk
            for f in "$D"/*.apk; do
              [ -e "$f" ] || continue
              b=$(basename "$f" .apk)
              nb=$(printf '%s' "$b" \
                | sed -E 's/-(x86_64|aarch64_[a-z0-9_]+|arm_[a-z0-9_-]+|i386_pentium4)$//' \
                | sed -E 's/([0-9]{4}\.[0-9]{2}\.[0-9]{2})\./\1~/')
              [ "$nb" != "$b" ] && mv -f "$f" "$D/$nb.apk" && echo "规范化 $b.apk -> $nb.apk"
            done
            if [ "${{ inputs.distro }}" = "24.10" ]; then
              # 本地 ipk 互相依赖时 opkg 偶尔按顺序失败，重试几次即可
              printf '#!/bin/sh\nopkg update || exit 1\nfor i in 1 2 3 4; do\n  opkg install ./*.ipk && exit 0\n  echo "第 $i 轮未完成，重试..."\n  sleep 1\ndone\nexit 1\n' > "$D/install.sh"
            else
              printf '#!/bin/sh\napk update || exit 1\napk add --allow-untrusted ./*.apk\n' > "$D/install.sh"
            fi
            chmod +x "$D/install.sh"
            ls -l "$D"
            /tmp/makeself/makeself.sh "$D" "$GITHUB_WORKSPACE/run/${APP}_x86_64.run" "$APP" ./install.sh
          done
          ls -lh "$GITHUB_WORKSPACE/run"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-${{ inputs.distro }}-runs
          path: ${{ github.workspace }}/run/*.run
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-${{ inputs.distro }}-buildlogs
          path: /tmp/blogs/*.log
          if-no-files-found: warn

      - name: 上传到 release
        if: inputs.upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE/run"
          ls -l
          if [ "${{ inputs.distro }}" = "24.10" ]; then TAG=extra-ipk; else TAG=extra-apk; fi
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
              --title "Extra Packages $TAG (source built)" \
              --notes "由 ImmortalWrt SDK 从源码编译，run 内已含运行时依赖闭包"
          gh release upload "$TAG" ./*.run -R "$GITHUB_REPOSITORY" --clobber
