# 用 ImmortalWrt SDK 从源码编译，不从任何 release / fork 取现成包。
#
# 每个应用编完单独打一个 <app>_x86_64.run，发到对应标签：
#   24.10 -> extra-ipk（ipk）
#   25.12 -> extra-apk（apk）
#
# apps 支持：
#   单个      clashoo
#   多个      "clashoo mosdns"
#   全部      all
#
# 用单 job + shell 循环：matrix 的 job-level if 拿不到 matrix 上下文，
# 动态 fromJSON 拆分又不被 workflow 解析器接受，所以不用 matrix。
# 每个应用在子 shell 里编译，一个编挂不影响后面的。
name: sdk build

on:
  workflow_dispatch:
    inputs:
      distro:
        description: 'SDK 版本'
        required: true
        default: '24.10'
        type: choice
        options: ['24.10', '25.12']
      apps:
        description: '要编译的应用（空格分隔，或填 all 全量）'
        required: true
        default: 'clashoo'
      upload:
        description: '是否上传到 release'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: sdk-build-${{ inputs.distro }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v6

      - name: 环境准备
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd build-essential libncurses-dev rsync

      - name: 下载并解压 SDK
        run: |
          set -eu
          case "${{ inputs.distro }}" in
            24.10) SDK_VER=24.10.4; GCC=13.3.0 ;;
            25.12) SDK_VER=25.12.2; GCC=14.3.0 ;;
          esac
          F="immortalwrt-sdk-${SDK_VER}-x86-64_gcc-${GCC}_musl.Linux-x86_64.tar.zst"
          URL="https://downloads.immortalwrt.org/releases/${SDK_VER}/targets/x86/64/${F}"
          echo "SDK: $URL"
          wget -q "$URL" -O /tmp/sdk.tar.zst
          ls -l /tmp/sdk.tar.zst
          mkdir -p /opt/sdk
          tar --zstd -xf /tmp/sdk.tar.zst -C /opt/sdk
          SDK_DIR=$(ls -d /opt/sdk/*/ | head -n1)
          echo "SDK_DIR=$SDK_DIR" >> "$GITHUB_ENV"
          echo "解压到 $SDK_DIR"
          ls "$SDK_DIR"

      - name: 更新 feeds
        run: |
          set -eu
          cd "$SDK_DIR"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "--- golang feed ---"
          ls feeds/packages/lang/golang/ 2>/dev/null | head -5 || echo "缺少 golang feed"

      - name: 逐个应用源码编译
        run: |
          set -u
          cd "$SDK_DIR"
          mkdir -p /opt/sdkout

          APPS="${{ inputs.apps }}"
          if [ "$APPS" = "all" ]; then
            APPS="clashoo mosdns openclash nikki momo passwall passwall2 ssrp homeproxy argon openlist2 quickfile dufs daede"
          fi
          echo "本轮编译: $APPS"

          FAILED=""
          for APP in $APPS; do
            echo ""
            echo "################################ $APP ################################"
            (
              set -e
              rm -rf /tmp/src
              rm -rf "package/$APP" "package/luci-app-$APP"
              case "$APP" in
                clashoo)   REPO=kenzok8/openwrt-clashoo;            BR=main;   DIRS="clashoo luci-app-clashoo" ;;
                mosdns)    REPO=sbwml/luci-app-mosdns;              BR=v5;     DIRS="mosdns luci-app-mosdns" ;;
                openclash) REPO=vernesong/OpenClash;                BR=master; DIRS="luci-app-openclash" ;;
                nikki)     REPO=nikkinikki-org/OpenWrt-nikki;       BR=main;   DIRS="nikki luci-app-nikki mihomo-meta" ;;
                momo)      REPO=nikkinikki-org/OpenWrt-momo;        BR=main;   DIRS="momo luci-app-momo" ;;
                passwall)  REPO=Openwrt-Passwall/openwrt-passwall;  BR=main;   DIRS="luci-app-passwall" ;;
                passwall2) REPO=Openwrt-Passwall/openwrt-passwall2; BR=main;   DIRS="luci-app-passwall2" ;;
                homeproxy) REPO=immortalwrt/homeproxy;              BR=master; DIRS="" ;;
                argon)     REPO=jerrykuku/luci-theme-argon;         BR=master; DIRS="" ;;
                openlist2) REPO=sbwml/luci-app-openlist2;           BR=main;   DIRS="openlist2 luci-app-openlist2" ;;
                quickfile) REPO=sbwml/luci-app-quickfile;           BR=main;   DIRS="quickfile luci-app-quickfile" ;;
                dufs)      REPO=zouzonghao/luci-app-dufs;           BR=main;   DIRS="" ;;
                daede)     REPO=kenzok8/openwrt-daede;              BR=main;   DIRS="dae daed luci-app-daede" ;;
                # ssrp：跳过 v2raya / naiveproxy / shadowsocksr-libev（体积大、Rust 易炸、协议淘汰）
                ssrp)      REPO=fw876/helloworld;                   BR=dev;    DIRS="luci-app-ssr-plus xray-core mihomo hysteria chinadns-ng dns2socks microsocks ipt2socks" ;;
                *) echo "::warning::未配置源码: $APP"; exit 2 ;;
              esac

              echo "源码: $REPO @$BR"
              git clone --depth=1 -b "$BR" "https://github.com/$REPO" /tmp/src
              if [ -z "$DIRS" ]; then
                # 仓库根目录本身就是一个包
                cp -r /tmp/src "package/$APP"
              else
                for d in $DIRS; do
                  if [ -d "/tmp/src/$d" ]; then
                    cp -r "/tmp/src/$d" "package/$d"
                  else
                    echo "::warning::$d 在 $REPO 里不存在"
                  fi
                done
              fi

              make defconfig
              if [ -d "package/$APP" ]; then
                make "package/$APP/compile" V=s -j"$(nproc)"
              else
                echo "::warning::package/$APP 不存在，跳过主包"
              fi
              for d in $DIRS; do
                [ "$d" = "$APP" ] && continue
                [ -d "package/$d" ] || continue
                make "package/$d/compile" V=s -j"$(nproc)" || echo "::warning::$d 编译失败"
              done

              rm -rf "/opt/sdkout/$APP"
              mkdir -p "/opt/sdkout/$APP"
              # 只收本应用相关的包：SDK 编 luci 时会把 base 里几百个基础包
              # 一起拉进 bin/packages，全收会让 run 从 24MB 涨到 222MB。
              PAT="^${APP}[_-]|^luci-app-${APP}[_-]|^luci-i18n-${APP}|^luci-theme-${APP}"
              for d in $DIRS; do
                PAT="$PAT|^${d}[_-]"
              done
              find bin/packages -type f \( -name '*.ipk' -o -name '*.apk' \) \
                | grep -E "$PAT" \
                | while IFS= read -r f; do cp -v "$f" "/opt/sdkout/$APP"/; done || true
              echo "--- $APP 收集到 $(ls -1 "/opt/sdkout/$APP" 2>/dev/null | wc -l) 个包 ---"
              ls -l "/opt/sdkout/$APP"
            )
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::warning::$APP 编译失败 rc=$rc，继续下一个"
              FAILED="$FAILED $APP"
            fi
          done
          echo ""
          echo "======== 失败清单:${FAILED:- 无} ========"

      - name: 打包成 run
        run: |
          set -u
          git clone --depth=1 https://github.com/megastep/makeself.git /tmp/makeself
          chmod +x /tmp/makeself/makeself.sh
          mkdir -p "$GITHUB_WORKSPACE/run"
          for D in /opt/sdkout/*/; do
            APP=$(basename "$D")
            n=$(ls "$D" 2>/dev/null | wc -l)
            [ "$n" -gt 0 ] || { echo "::warning::$APP 无产物，跳过"; continue; }
            # apk 文件名必须严格等于 <pkgname>-<pkgver>.apk
            for f in "$D"/*.apk; do
              [ -e "$f" ] || continue
              b=$(basename "$f" .apk)
              nb=$(printf '%s' "$b" \
                | sed -E 's/-(x86_64|aarch64_[a-z0-9_]+|arm_[a-z0-9_-]+|i386_pentium4)$//' \
                | sed -E 's/([0-9]{4}\.[0-9]{2}\.[0-9]{2})\./\1~/')
              [ "$nb" != "$b" ] && mv -f "$f" "$D/$nb.apk" && echo "规范化 $b.apk -> $nb.apk"
            done
            if [ "${{ inputs.distro }}" = "24.10" ]; then
              printf '#!/bin/sh\nopkg update || exit 1\nopkg install ./*.ipk\n' > "$D/install.sh"
            else
              printf '#!/bin/sh\napk update || exit 1\napk add --allow-untrusted ./*.apk\n' > "$D/install.sh"
            fi
            chmod +x "$D/install.sh"
            ls -l "$D"
            /tmp/makeself/makeself.sh "$D" "$GITHUB_WORKSPACE/run/${APP}_x86_64.run" "$APP" ./install.sh
          done
          ls -l "$GITHUB_WORKSPACE/run"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-${{ inputs.distro }}-runs
          path: ${{ github.workspace }}/run/*.run
          if-no-files-found: warn

      - name: 上传到 release
        if: inputs.upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE/run"
          ls -l
          if [ "${{ inputs.distro }}" = "24.10" ]; then TAG=extra-ipk; else TAG=extra-apk; fi
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
              --title "Extra Packages $TAG (source built)" \
              --notes "由 ImmortalWrt SDK 从源码编译"
          gh release upload "$TAG" ./*.run -R "$GITHUB_REPOSITORY" --clobber
