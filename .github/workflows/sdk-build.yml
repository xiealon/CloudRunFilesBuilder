# 用 ImmortalWrt SDK 从源码编译，不从任何 release / fork 取现成包。
#
# 每个 app 一个 job（matrix），最后打成 <app>_x86_64.run，发到对应标签：
#   24.10 -> extra-ipk（ipk）
#   25.12 -> extra-apk（apk）
#
# 触发方式：
#   apps 用空格分隔，例如 "clashoo mosdns"
#   distro 选 24.10 或 25.12
name: sdk build

on:
  workflow_dispatch:
    inputs:
      distro:
        description: 'SDK 版本：24.10 或 25.12'
        required: true
        default: '24.10'
        type: choice
        options: ['24.10', '25.12']
      apps:
        description: '要编译的应用，空格分隔（clashoo mosdns ...）'
        required: true
        default: 'clashoo mosdns'
      upload:
        description: '是否上传到 release'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: sdk-build-${{ inputs.distro }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(format('["{0}"]', replace(inputs.apps, ' ', '","'))) }}
    steps:
      - uses: actions/checkout@v6

      - name: 环境准备
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd build-essential libncurses-dev rsync

      - name: 下载并解压 SDK
        run: |
          set -eu
          case "${{ inputs.distro }}" in
            24.10) SDK_VER=24.10.4; GCC=13.3.0 ;;
            25.12) SDK_VER=25.12.2; GCC=14.3.0 ;;
          esac
          F="immortalwrt-sdk-${SDK_VER}-x86-64_gcc-${GCC}_musl.Linux-x86_64.tar.zst"
          URL="https://downloads.immortalwrt.org/releases/${SDK_VER}/targets/x86/64/${F}"
          echo "SDK: $URL"
          wget -q "$URL" -O /tmp/sdk.tar.zst
          ls -l /tmp/sdk.tar.zst
          mkdir -p /opt/sdk
          tar --zstd -xf /tmp/sdk.tar.zst -C /opt/sdk
          SDK_DIR=$(ls -d /opt/sdk/*/ | head -n1)
          echo "SDK_DIR=$SDK_DIR" >> "$GITHUB_ENV"
          echo "解压到 $SDK_DIR"
          ls "$SDK_DIR" | head -20

      - name: 更新 feeds
        run: |
          set -eu
          cd "$SDK_DIR"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "--- golang 是否就位 ---"
          ls feeds/packages/lang/golang/ 2>/dev/null | head -5 || echo "缺少 golang feed"

      - name: 拉源码进 package/
        run: |
          set -eu
          cd "$SDK_DIR"
          APP="${{ matrix.app }}"
          mkdir -p /tmp/src
          case "$APP" in
            clashoo)
              git clone --depth=1 https://github.com/kenzok8/openwrt-clashoo /tmp/src/clashoo
              cp -r /tmp/src/clashoo/clashoo package/clashoo
              cp -r /tmp/src/clashoo/luci-app-clashoo package/luci-app-clashoo
              ;;
            mosdns)
              git clone --depth=1 -b v5 https://github.com/sbwml/luci-app-mosdns /tmp/src/mosdns
              cp -r /tmp/src/mosdns/mosdns package/mosdns
              cp -r /tmp/src/mosdns/luci-app-mosdns package/luci-app-mosdns
              ;;
            *)
              echo "::error::未配置源码: $APP"
              exit 1
              ;;
          esac
          echo "--- package/ 下的目标 ---"
          ls -d package/*/ | grep -E "clashoo|mosdns" || true

      - name: 编译
        run: |
          set -eu
          cd "$SDK_DIR"
          APP="${{ matrix.app }}"
          make defconfig
          # golang 是 host 依赖，首次编译会自行 bootstrap，耗时较长属正常
          make package/$APP/compile V=s -j"$(nproc)" || true
          LUCI="package/luci-app-$APP/compile"
          if grep -q "PKG_NAME" "package/luci-app-$APP/Makefile" 2>/dev/null; then
            make $LUCI V=s -j"$(nproc)" || true
          fi
          echo "--- 产物 ---"
          find bin/packages -type f \( -name '*.ipk' -o -name '*.apk' \) | sort

      - name: 收集并打包成 run
        run: |
          set -eu
          cd "$SDK_DIR"
          APP="${{ matrix.app }}"
          OUT="$GITHUB_WORKSPACE/out/$APP"
          mkdir -p "$OUT"
          find bin/packages -type f \( -name '*.ipk' -o -name '*.apk' \) -exec cp {} "$OUT"/ \;
          # apk 文件名必须严格等于 <pkgname>-<pkgver>.apk
          for f in "$OUT"/*.apk; do
            [ -e "$f" ] || continue
            b=$(basename "$f" .apk)
            nb=$(printf '%s' "$b" \
              | sed -E 's/-(x86_64|aarch64_[a-z0-9_]+|arm_[a-z0-9_-]+|i386_pentium4)$//' \
              | sed -E 's/([0-9]{4}\.[0-9]{2}\.[0-9]{2})\./\1~/')
            [ "$nb" != "$b" ] && mv -f "$f" "$OUT/$nb.apk" && echo "规范化 $b.apk -> $nb.apk"
          done
          if [ "${{ inputs.distro }}" = "24.10" ]; then
            printf '#!/bin/sh\nopkg update || exit 1\nopkg install ./*.ipk\n' > "$OUT/install.sh"
          else
            printf '#!/bin/sh\napk update || exit 1\napk add --allow-untrusted ./*.apk\n' > "$OUT/install.sh"
          fi
          ls -l "$OUT"

          git clone --depth=1 https://github.com/megastep/makeself.git /tmp/makeself
          chmod +x /tmp/makeself/makeself.sh
          /tmp/makeself/makeself.sh "$OUT" "$GITHUB_WORKSPACE/${APP}_x86_64.run" "$APP" ./install.sh
          ls -l "$GITHUB_WORKSPACE"/*.run

      - uses: actions/upload-artifact@v4
        with:
          name: run-${{ inputs.distro }}-${{ matrix.app }}
          path: ${{ github.workspace }}/*.run

      - name: 上传到 release
        if: inputs.upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if [ "${{ inputs.distro }}" = "24.10" ]; then TAG=extra-ipk; else TAG=extra-apk; fi
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "$TAG" --notes "sdk built"
          gh release upload "$TAG" "$GITHUB_WORKSPACE"/*.run -R "$GITHUB_REPOSITORY" --clobber
