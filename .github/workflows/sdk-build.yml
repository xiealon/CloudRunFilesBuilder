# 用 ImmortalWrt SDK 从源码编译，不从任何 release / fork 取现成包。
#
# 每个应用编完单独打一个 <app>_x86_64.run，发到对应标签：
#   24.10 -> extra-ipk（ipk）
#   25.12 -> extra-apk（apk）
#
# apps 支持：
#   单个      clashoo
#   多个      "clashoo mosdns"
#   全部      all
#
# 2026-10-26 改动：
#   1. 拆成两个并行 job（matrix）：
#        main  -> 常规应用
#        heavy -> openclash / openlist2（依赖脏、最重），失败不影响 main，也不会把整个 run 拖红
#   2. 关键修复：GitHub Actions 的 run 默认是 `bash -eo pipefail`，
#      之前子 shell 编挂会直接把整个 step 干掉（rc=$? 永远执行不到），
#      所以"继续下一个应用"从来没生效过。这里显式 set +e。
#   3. 单个应用编译加 timeout，防止某个包卡死吃满 350 分钟。
name: sdk build

on:
  workflow_dispatch:
    inputs:
      distro:
        description: 'SDK 版本'
        required: true
        default: '24.10'
        type: choice
        options: ['24.10', '25.12']
      apps:
        description: '要编译的应用（空格分隔，或填 all 全量）'
        required: true
        default: 'clashoo'
      upload:
        description: '是否上传到 release'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    # heavy 组失败只标记，不拖累整个 run
    continue-on-error: ${{ matrix.heavy }}
    # 注意：workflow 级 concurrency 拿不到 matrix 上下文，会整份文件被判无效，
    # 所以放在 job 级
    concurrency:
      group: sdk-build-${{ inputs.distro }}-${{ matrix.group }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: main
            heavy: false
            apps: 'clashoo mosdns nikki momo passwall passwall2 ssrp homeproxy argon quickfile dufs daede'
          - group: heavy
            heavy: true
            apps: 'openclash openlist2'
    steps:
      - uses: actions/checkout@v6

      - name: 环境准备
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd build-essential libncurses-dev rsync

      - name: 下载并解压 SDK
        run: |
          set -eu
          case "${{ inputs.distro }}" in
            24.10) SDK_VER=24.10.4; GCC=13.3.0 ;;
            25.12) SDK_VER=25.12.2; GCC=14.3.0 ;;
          esac
          F="immortalwrt-sdk-${SDK_VER}-x86-64_gcc-${GCC}_musl.Linux-x86_64.tar.zst"
          URL="https://downloads.immortalwrt.org/releases/${SDK_VER}/targets/x86/64/${F}"
          echo "SDK: $URL"
          wget -q "$URL" -O /tmp/sdk.tar.zst
          ls -l /tmp/sdk.tar.zst
          mkdir -p /opt/sdk
          tar --zstd -xf /tmp/sdk.tar.zst -C /opt/sdk
          SDK_DIR=$(ls -d /opt/sdk/*/ | head -n1)
          echo "SDK_DIR=$SDK_DIR" >> "$GITHUB_ENV"
          echo "解压到 $SDK_DIR"
          ls "$SDK_DIR"

      - name: 更新 feeds
        run: |
          set -eu
          cd "$SDK_DIR"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "--- golang feed ---"
          ls feeds/packages/lang/golang/ 2>/dev/null | head -5 || echo "缺少 golang feed"

      - name: 逐个应用源码编译
        run: |
          # 必须关掉 -e：否则子 shell 编挂会直接终止整个 step，
          # 下面的 rc=$? 根本执行不到，"失败继续下一个"就成了空话
          set +e
          set -u
          cd "$SDK_DIR"
          mkdir -p /opt/sdkout

          APPS=""
          REQ="${{ inputs.apps }}"
          if [ "$REQ" = "all" ]; then
            APPS="${{ matrix.apps }}"
          else
            # 只在指定应用时按本组归属过滤，避免两个 job 重复编同一个包
            for a in $REQ; do
              case " ${{ matrix.apps }} " in
                *" $a "*) APPS="$APPS $a" ;;
              esac
            done
          fi
          if [ -z "${APPS// /}" ]; then
            echo "本组(${{ matrix.group }})没有要编的应用，跳过"
            exit 0
          fi
          echo "本组(${{ matrix.group }})编译: $APPS"

          FAILED=""
          OKAPPS=""
          for APP in $APPS; do
            echo ""
            echo "################################ $APP ################################"
            (
              set -e
              rm -rf /tmp/src
              rm -rf "package/$APP" "package/luci-app-$APP"
              case "$APP" in
                clashoo)   REPO=kenzok8/openwrt-clashoo;            BR=main;   DIRS="clashoo luci-app-clashoo" ;;
                mosdns)    REPO=sbwml/luci-app-mosdns;              BR=v5;     DIRS="mosdns luci-app-mosdns" ;;
                openclash) REPO=vernesong/OpenClash;                BR=master; DIRS="luci-app-openclash" ;;
                nikki)     REPO=nikkinikki-org/OpenWrt-nikki;       BR=main;   DIRS="nikki luci-app-nikki mihomo-meta" ;;
                momo)      REPO=nikkinikki-org/OpenWrt-momo;        BR=main;   DIRS="momo luci-app-momo" ;;
                passwall)  REPO=Openwrt-Passwall/openwrt-passwall;  BR=main;   DIRS="luci-app-passwall" ;;
                passwall2) REPO=Openwrt-Passwall/openwrt-passwall2; BR=main;   DIRS="luci-app-passwall2" ;;
                homeproxy) REPO=immortalwrt/homeproxy;              BR=master; DIRS="" ;;
                argon)     REPO=jerrykuku/luci-theme-argon;         BR=master; DIRS="" ;;
                openlist2) REPO=sbwml/luci-app-openlist2;           BR=main;   DIRS="openlist2 luci-app-openlist2" ;;
                quickfile) REPO=sbwml/luci-app-quickfile;           BR=main;   DIRS="quickfile luci-app-quickfile" ;;
                dufs)      REPO=zouzonghao/luci-app-dufs;           BR=main;   DIRS="" ;;
                daede)     REPO=kenzok8/openwrt-daede;              BR=main;   DIRS="dae daed luci-app-daede" ;;
                # ssrp：跳过 v2raya / naiveproxy / shadowsocksr-libev（体积大、Rust 易炸、协议淘汰）
                ssrp)      REPO=fw876/helloworld;                   BR=dev;    DIRS="luci-app-ssr-plus xray-core mihomo hysteria chinadns-ng dns2socks microsocks ipt2socks" ;;
                *) echo "::warning::未配置源码: $APP"; exit 2 ;;
              esac

              echo "源码: $REPO @$BR"
              git clone --depth=1 -b "$BR" "https://github.com/$REPO" /tmp/src
              if [ -z "$DIRS" ]; then
                # 仓库根目录本身就是一个包
                cp -r /tmp/src "package/$APP"
              else
                for d in $DIRS; do
                  if [ -d "/tmp/src/$d" ]; then
                    cp -r "/tmp/src/$d" "package/$d"
                  else
                    echo "::warning::$d 在 $REPO 里不存在"
                  fi
                done
              fi

              make defconfig
              if [ -d "package/$APP" ]; then
                timeout 2700 make "package/$APP/compile" V=s -j"$(nproc)"
              elif [ -d "package/luci-app-$APP" ]; then
                timeout 2700 make "package/luci-app-$APP/compile" V=s -j"$(nproc)"
              else
                echo "::warning::package/$APP 与 package/luci-app-$APP 都不存在"
              fi
              for d in $DIRS; do
                [ "$d" = "$APP" ] && continue
                [ -d "package/$d" ] || continue
                timeout 2700 make "package/$d/compile" V=s -j"$(nproc)" || echo "::warning::$d 编译失败"
              done

              rm -rf "/opt/sdkout/$APP"
              mkdir -p "/opt/sdkout/$APP"
              # 只收本应用相关的包：SDK 编 luci 时会把 base 里几百个基础包
              # 一起拉进 bin/packages，全收会让 run 从 24MB 涨到 222MB。
              PAT="^${APP}[_-]|^luci-app-${APP}[_-]|^luci-i18n-${APP}|^luci-theme-${APP}"
              for d in $DIRS; do
                PAT="$PAT|^${d}[_-]"
              done
              # find 输出的是 bin/packages/x86_64/base/xxx.ipk 这样的完整路径，
              # 直接用 grep -E "^clashoo" 匹配行首永远落空，必须取 basename 再匹配。
              find bin/packages -type f \( -name '*.ipk' -o -name '*.apk' \) \
                | awk -F/ -v P="$PAT" '$NF ~ P' \
                | while IFS= read -r f; do cp -v "$f" "/opt/sdkout/$APP"/; done
              N=$(ls -1 "/opt/sdkout/$APP" 2>/dev/null | wc -l)
              SZ=$(du -sh "/opt/sdkout/$APP" 2>/dev/null | cut -f1)
              echo "--- $APP 收集到 $N 个包，共 $SZ ---"
              ls -l "/opt/sdkout/$APP"
              if [ "$N" -eq 0 ]; then
                echo "::warning::$APP 编译完成但一个包都没收到，检查收集规则"
                exit 3
              fi
            )
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::warning::$APP 编译失败 rc=$rc，继续下一个"
              FAILED="$FAILED $APP"
            else
              OKAPPS="$OKAPPS $APP"
            fi
          done
          echo ""
          echo "======== 成功:${OKAPPS:- 无} 失败:${FAILED:- 无} ========"
          # 只有全组都没出包时才算这组失败，其余情况交给打包装箱环节
          if [ -z "$(ls -A /opt/sdkout 2>/dev/null)" ]; then
            echo "::warning::本组(${{ matrix.group }})没有任何产物"
          fi

      - name: 打包成 run
        run: |
          set -u
          git clone --depth=1 https://github.com/megastep/makeself.git /tmp/makeself
          chmod +x /tmp/makeself/makeself.sh
          mkdir -p "$GITHUB_WORKSPACE/run"
          for D in /opt/sdkout/*/; do
            [ -d "$D" ] || continue
            APP=$(basename "$D")
            n=$(ls "$D" 2>/dev/null | wc -l)
            [ "$n" -gt 0 ] || { echo "::warning::$APP 无产物，跳过"; continue; }
            # apk 文件名必须严格等于 <pkgname>-<pkgver>.apk
            for f in "$D"/*.apk; do
              [ -e "$f" ] || continue
              b=$(basename "$f" .apk)
              nb=$(printf '%s' "$b" \
                | sed -E 's/-(x86_64|aarch64_[a-z0-9_]+|arm_[a-z0-9_-]+|i386_pentium4)$//' \
                | sed -E 's/([0-9]{4}\.[0-9]{2}\.[0-9]{2})\./\1~/')
              [ "$nb" != "$b" ] && mv -f "$f" "$D/$nb.apk" && echo "规范化 $b.apk -> $nb.apk"
            done
            if [ "${{ inputs.distro }}" = "24.10" ]; then
              printf '#!/bin/sh\nopkg update || exit 1\nopkg install ./*.ipk\n' > "$D/install.sh"
            else
              printf '#!/bin/sh\napk update || exit 1\napk add --allow-untrusted ./*.apk\n' > "$D/install.sh"
            fi
            chmod +x "$D/install.sh"
            ls -l "$D"
            /tmp/makeself/makeself.sh "$D" "$GITHUB_WORKSPACE/run/${APP}_x86_64.run" "$APP" ./install.sh
          done
          ls -l "$GITHUB_WORKSPACE/run"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-${{ inputs.distro }}-${{ matrix.group }}-runs
          path: ${{ github.workspace }}/run/*.run
          if-no-files-found: warn

      - name: 上传到 release
        if: inputs.upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE/run"
          ls -l
          if [ "${{ inputs.distro }}" = "24.10" ]; then TAG=extra-ipk; else TAG=extra-apk; fi
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
              --title "Extra Packages $TAG (source built)" \
              --notes "由 ImmortalWrt SDK 从源码编译" || true
          gh release upload "$TAG" ./*.run -R "$GITHUB_REPOSITORY" --clobber
