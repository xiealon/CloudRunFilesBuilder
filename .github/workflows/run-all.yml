name: 一键生产（本分支）

# 只在本分支内生产：extras 打本架构的 .run，build-runs 出 clashoo/mosdns，
# 两者都直接覆盖本分支对应的 release（extra-ipk / extra-apk）。
# 不跨分支、不碰其他架构的东西。

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch extras + build-runs on this branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          set -eu
          echo "branch = $REF"
          for wf in extras.yml build-runs.yml; do
            id=$(gh api "repos/$REPO/actions/workflows/$wf" --jq .id)
            gh api --method POST "repos/$REPO/actions/workflows/$id/dispatches" -f ref="$REF"
            echo "  dispatched $wf @ $REF"
            sleep 2
          done
