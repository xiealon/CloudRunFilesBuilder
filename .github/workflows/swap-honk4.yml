name: Swap honk release to beta4-r3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  swap:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Upload beta4-r3 assets and retitle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=honk-apk
          SRC=backups/honk-0.1.0_beta4-r3
          echo "== 清理 beta5 残留 =="
          gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r n; do
            case "$n" in
              *beta5*|*26.307*) echo "  delete $n"; gh release delete-asset "$TAG" "$n" -y || true ;;
              *) echo "  keep   $n" ;;
            esac
          done
          echo "== 上传 beta4-r3 =="
          for f in "$SRC"/*.run "$SRC"/*.apk; do
            echo "  upload $(basename "$f")"
            gh release upload "$TAG" "$f" --clobber
          done
          echo "== 改标题 =="
          gh release edit "$TAG" --name "honk 0.1.0_beta4-r3 - $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
          echo "== 最终资产 =="
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)  \(.size)"'
