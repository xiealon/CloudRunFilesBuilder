#=================================================
# honk（OpenWrt 25.12 / apk）→ 自解压 .run
#
# 与 25-openwrt-daede.yml 同一套框架，差异只在数据来源：
#   daede：curl GitHub Release API → jq 解析 → 下载（kenzok8/openwrt-daede）
#   honk ：curl kenzok8/openwrt-honk 的 Release API，只取 2 个 apk：
#          honk-<ver>-<ARCH_PACKAGES>.apk            （约 12.4 MB）
#          luci-app-honk-<ver>-<ARCH_PACKAGES>.apk   （约 1.4 MB，含 doona 面板 3.8 MB）
#
# 三个架构各 2 个包、共 6 个：x86_64 / aarch64_generic / aarch64_cortex-a53。
# 架构名按 ARCH_PACKAGES 全名匹配，不要按 aarch64 子串。
#=================================================

name: Build 25.12 openwrt-honk

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'kenzok8/openwrt-honk 的 release tag（留空 = latest）'
        required: false
        default: ''
      tag_name:
        description: 'Release tag（留空 = honk-apk，固定覆盖）'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-22.04
    # 发 Release 需要写 contents；默认 token 只有只读权限，
    # 不声明这里会 403 "Resource not accessible by integration"
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Clone makeself repository
        run: git clone --depth 1 https://github.com/megastep/makeself.git

      - name: Parse apk filenames from kenzok8 release
        id: parse
        env:
          HONK_TAG: ${{ inputs.tag }}
        run: bash shell/parse_honk_assets.sh

      - name: Download apk files
        run: bash shell/download_honk_apks.sh

      - name: Create install.sh scripts
        run: |
          cat > x86/install.sh <<'INSTALL_EOF'
          #!/bin/sh
          set -e
          echo "==> honk 安装器（OpenWrt 25.12 / apk）"

          apk update || { echo "❌ apk update 失败，检查网络或源"; exit 1; }

          if [ ! -e /sys/kernel/btf/vmlinux ]; then
              echo ""
              echo "⚠️  内核没有 /sys/kernel/btf/vmlinux"
              echo "    honk 的 eBPF 程序要求 Linux >= 6.12 且 CONFIG_DEBUG_INFO_BTF=y"
              echo "    继续安装，但 honk-core 大概率起不来"
              echo ""
          fi

          echo "==> apk add --allow-untrusted *.apk"
          apk add --allow-untrusted *.apk

          echo ""
          echo "✅ 已安装：honk / luci-app-honk（含 doona 面板）"
          echo ""
          echo "默认不启动。启用方式："
          echo "  uci set honk.config.enabled=1"
          echo "  uci commit honk"
          echo "  /etc/init.d/honk enable && /etc/init.d/honk start"
          echo ""
          echo "LuCI 入口：服务 → Honk（面板端口 9527）"
          INSTALL_EOF
          chmod +x x86/install.sh
          cp x86/install.sh arm64/install.sh
          cp x86/install.sh arm64-a53/install.sh

      - name: Move directories to makeself
        run: |
          mv x86 makeself/
          mv arm64 makeself/
          mv arm64-a53 makeself/

      - name: Create self-extracting packages
        run: |
          cd makeself
          ./makeself.sh x86/ "25-openwrt-honk-${VERSION}-x86_64.run" "honk ${VERSION} for OpenWrt 25.12" ./install.sh
          ./makeself.sh arm64/ "25-openwrt-honk-${VERSION}-aarch64_generic.run" "honk ${VERSION} for OpenWrt 25.12" ./install.sh
          ./makeself.sh arm64-a53/ "25-openwrt-honk-${VERSION}-aarch64_cortex-a53.run" "honk ${VERSION} for OpenWrt 25.12" ./install.sh

      - name: Check file sizes
        run: ls -lh makeself/*.run

      - name: Set release tag and name
        id: vars
        env:
          IN_TAG: ${{ inputs.tag_name }}
        run: |
          if [ -n "$IN_TAG" ]; then
              TAG="$IN_TAG"
          else
              # 固定 tag，与仓库里 extra-apk / extra-ipk / lxc-latest 的风格一致：
              # 永远只有一个 Release，每次构建覆盖 assets，不累积日期 tag。
              TAG="honk-apk"
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "RELEASE_NAME=honk ${VERSION} · $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')" >> $GITHUB_ENV
          echo "tag=$TAG"

      - name: Upload run files as release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.RELEASE_NAME }}
          # makeself/*.run    → 路由器上直接跑的自解压包（三架构）
          # makeself/x86/*.apk → 散装 apk，给 ImageBuilder 构建时直接装进固件，
          #                      这样固件侧不必再挂 openwrt.daeuniverse.org 的第三方源
          files: |
            makeself/*.run
            makeself/x86/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            **honk ${{ env.VERSION }}** — OpenWrt 25.12 自解压安装包

            **两类产物**：`25-openwrt-honk-*.run` 三架构自解压包（路由器上直接跑）；
            `honk-*.apk` + `luci-app-honk-*.apk` 两个 x86_64 散装 apk（给 ImageBuilder 构建时装进固件）。

            | 包 | 说明 |
            |---|---|
            | honk | eBPF 透明代理引擎（dae 的独立实现） |
            | luci-app-honk | LuCI 界面 + 内置 doona 面板（3.8 MB 静态文件） |

            **要求**：Linux >= 6.12 且 `CONFIG_DEBUG_INFO_BTF=y`

            **用法**
            ```sh
            chmod +x 25-openwrt-honk-*-x86_64.run
            ./25-openwrt-honk-*-x86_64.run
            ```
            装完默认不启动，到 LuCI「服务 → Honk」开关，或：
            ```sh
            uci set honk.config.enabled=1 && uci commit honk
            /etc/init.d/honk enable && /etc/init.d/honk start
            ```

            > honk 与 dae/daed **互斥**（都占用 `dae0` 设备与 `daens` 命名空间），同机只能留一个。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
